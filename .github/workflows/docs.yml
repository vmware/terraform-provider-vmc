name: Check Documentation

on:
  pull_request:

permissions:
  contents: read

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v7.0.1
    - name: Install Tools
      run: make tools
    - name: Check HCL in Documentation
      run: make docs-hcl-lint
